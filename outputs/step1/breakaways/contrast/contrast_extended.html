<html lang="en">
<head>

  <title>Contrast extended (disagreement-only)</title>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5c6b7a;

      --paper: #f7f5f1;
      --card: #fffcf7;
    }
    * { box-sizing: border-box; }
    body {

      font-family: "Source Serif 4", "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      color: var(--ink);
      background:

      min-height: 100vh;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3.5rem;
    }
    h1 {
      font-size: clamp(1.55rem, 3vw, 2.15rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
    }
    .lede {
      color: var(--muted);
      max-width: 40rem;
      line-height: 1.5;
      margin: 0 0 1.35rem;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.75rem;
      margin-bottom: 1.1rem;
      padding-bottom: 0.9rem;
      border-bottom: 1px solid var(--line);
    }
    .stat strong {
      display: block;
      font-size: 1.45rem;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .stat span { color: var(--muted); font-size: 0.88rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.1rem;
      align-items: end;
      margin-bottom: 1.35rem;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    select, input[type="search"] {
      font: inherit;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.4rem 0.55rem;
      min-width: 11rem;
    }
    input[type="search"] { min-width: 14rem; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 15rem) minmax(0, 1fr);
      gap: 1.25rem;
      align-items: start;
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .toc { max-height: 12rem; }
    }
    .toc {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 6px;
      max-height: calc(100vh - 12rem);
      overflow: auto;
      position: sticky;
      top: 1rem;
    }
    .toc button {
      display: block;
      width: 100%;
      text-align: left;
      font: inherit;
      font-size: 0.82rem;
      line-height: 1.35;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 0.55rem 0.7rem;
      cursor: pointer;
    }
    .toc button:hover { background: rgba(42, 95, 122, 0.06); }
    .toc button.active {
      background: rgba(42, 95, 122, 0.1);
      color: var(--accent);
      font-weight: 600;
    }
    .toc .g {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: none;
      letter-spacing: 0;
      margin-top: 0.15rem;
      font-weight: 400;
    }
    .viewer {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 6px;
      padding: 1.35rem 1.4rem 1.5rem;
      min-height: 22rem;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .nav button {
      font: inherit;
      font-size: 0.9rem;
      color: var(--accent);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
    }
    .nav button:hover { border-color: var(--accent); }
    .nav button:disabled {
      opacity: 0.4;
      cursor: default;
      border-color: var(--line);
    }
    .pos {
      color: var(--muted);
      font-size: 0.88rem;
      font-variant-numeric: tabular-nums;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.85rem;
      margin-bottom: 0.85rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .pill {
      display: inline-block;
      padding: 0.12rem 0.45rem;
      border-radius: 3px;
      background: rgba(138, 75, 47, 0.1);
      color: var(--break);
    }
    .question {
      font-size: clamp(1.15rem, 2.2vw, 1.45rem);
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.015em;
      margin: 0 0 1.25rem;
    }
    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 700px) {
      .answers { grid-template-columns: 1fr; }
    }
    .answer {
      border-top: 3px solid var(--line);
      padding-top: 0.7rem;
    }
    .answer.catholic { border-top-color: var(--catholic); }
    .answer.breakaway { border-top-color: var(--break); }
    .answer h2 {
      margin: 0 0 0.45rem;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .answer.catholic h2 { color: var(--catholic); }
    .answer.breakaway h2 { color: var(--break); }
    .answer p {
      margin: 0;
      line-height: 1.55;
      font-size: 0.98rem;
    }
    .cite {
      margin-top: 1.35rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--line);
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .cite strong {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .notes {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
      font-style: italic;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.18rem 0.45rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .badge.strict { color: var(--catholic); border-color: #b7d4c4; background: #f0f7f3; }
    .badge.extended { color: var(--accent2); border-color: #e2c4b4; background: #faf3ef; }
    .empty {
      color: var(--muted);
      padding: 2rem 0.5rem;
      text-align: center;
    }
    footer {
      margin-top: 1.75rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    footer code { font-size: 0.8em; }
  </style>
</head>

nd": "inferred_opposition"}, {"id": "con2-canon14-en", "question": "Must the letter said to be of Ibas to Maris—denying that the Word was made man of Mary Mother of God and attacking Cyril and Ephesus—be rejected rather than defended?", "catholic_answer": "Yes. That letter is to be rejected, not defended; its denial of the Word made man of Mary Mother of God and its attack on Cyril and Ephesus are condemned.", "breakaway_group": "Church of the East", "breakaway_answer": "No. That letter’s sharper distinction of divinity and humanity may be defended; the Cyrilline anathematizing settlement is not accepted as binding in that way.", "council": "Second Council of Constantinople", "canonical_citation": "Constantinople II canon 14", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "con2-canon6-en", "question": "Is the ever-virgin Mary exactly and truly the Mother of God, because God the Word was made flesh and born of her?", "catholic_answer": "Yes. She is exactly and truly the Mother of God, because God the Word begotten of the Father was in these last days made flesh and born of her.", "breakaway_group": "Church of the East", "breakaway_answer": "No—not as that forced ‘exactly and truly’ Theotokos confession. Mother of Christ language is preferred, keeping divinity and humanity distinct.", "council": "Second Council of Constantinople", "canonical_citation": "Constantinople II canon 6", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "chal-definition-en", "question": "After the Incarnation, is Jesus Christ to be confessed in two natures, without confusion, change, division, or separation, united in one person and one hypostasis?", "catholic_answer": "Yes. After the Incarnation, the one and the same Son is confessed in two natures, without confusion, change, division, or separation, the property of each preserved in one person and one hypostasis.", "breakaway_group": "Oriental Orthodox churches", "breakaway_answer": "No. After the union he is confessed as one united nature of the Word incarnate (miaphysite)—perfect in divinity and humanity without separating them into two natures after the union.", "council": "Council of Chalcedon", "canonical_citation": "Chalcedon, Definition of Faith", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "con2-canon5-en", "question": "When Chalcedon speaks of one person/hypostasis of Christ, does that mean a Nestorian union of many hypostases, or the Word united to flesh in one hypostasis?", "catholic_answer": "It means the Word united to flesh in one hypostasis. It does not mean a mere union of many hypostases under one honorary ‘person.’", "breakaway_group": "Oriental Orthodox churches", "breakaway_answer": "That ‘one person’ language is not received in their sense. One united nature of the Word incarnate is confessed, without endorsing their gloss on that formula.", "council": "Second Council of Constantinople", "canonical_citation": "Constantinople II canon 5", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "con2-canon7-en", "question": "When we say Christ is in two natures, do we mean an unconfused hypostatic union in which each nature remains what it was?", "catholic_answer": "Yes. ‘In two natures’ names the unconfused hypostatic union in which divinity and humanity each remain what they were in the one Lord Jesus Christ.", "breakaway_group": "Oriental Orthodox churches", "breakaway_answer": "No. That ‘in two natures’ settlement is refused; after the union he is confessed as one united nature of the Word incarnate.", "council": "Second Council of Constantinople", "canonical_citation": "Constantinople II canon 7", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "con2-canon8-en", "question": "Does confessing two natures—or the one nature of God the Word made flesh—mean a hypostatic union of Godhead and humanity in one Christ without mixture or confusion?", "catholic_answer": "Yes. Either expression, rightly used, means the hypostatic union of Godhead and humanity in one Christ without mixture or confusion of the natures.", "breakaway_group": "Oriental Orthodox churches", "breakaway_answer": "No. The binding reception of that regulation of the phrases is refused; after the union he is confessed as one united nature of the Word incarnate.", "council": "Second Council of Constantinople", "canonical_citation": "Constantinople II canon 8", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s8-p10-en", "question": "Are all sacraments effected only when matter, form, and a minister intending to do what the Church does are present?", "catholic_answer": "Yes. All sacraments are effected only when matter, form, and a minister intending to do what the rite does are present.", "breakaway_group": "Armenian Apostolic Church", "breakaway_answer": "No. Sacramental life follows the received Eastern rites and theology; that matter–form–intention schematization is not binding.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S8 para. 10", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s8-p11-en", "question": "Do baptism, confirmation, and orders imprint an indelible character on the soul and so cannot be repeated, unlike the other four sacraments?", "catholic_answer": "Yes. Do baptism, confirmation, and orders imprint an indelible character on the soul and so cannot be repeated, unlike the other four sacraments.", "breakaway_group": "Armenian Apostolic Church", "breakaway_answer": "No. Sacramental life follows the received Eastern rites and theology; that matter–form–intention schematization is not binding.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S8 para. 11", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s8-p12-en", "question": "Is baptism the gate of spiritual life, using true water and the Trinitarian form, without which one cannot enter the kingdom of heaven?", "catholic_answer": "Yes. Baptism the gate of spiritual life, using is true water and the Trinitarian form, without which one cannot enter the kingdom of heaven.", "breakaway_group": "Armenian Apostolic Church", "breakaway_answer": "No. Sacramental life follows the received Eastern rites and theology; that matter–form–intention schematization is not binding.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S8 para. 12", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s8-p13-en", "question": "Is confirmation’s matter chrism blessed by a bishop, and is a bishop its ordinary minister who alone ought to confer it?", "catholic_answer": "Yes. Confirmation’s matter chrism blessed by a bishop, and is a bishop its ordinary minister who alone ought to confer it.", "breakaway_group": "Armenian Apostolic Church", "breakaway_answer": "No. Sacramental life follows the received Eastern rites and theology; that matter–form–intention schematization is not binding.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S8 para. 13", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s8-p14-en", "question": "Does penance require the penitent’s contrition, oral confession, and satisfaction, with a priest’s absolution as its form?", "catholic_answer": "Yes. It requires the penitent’s contrition, oral confession, and satisfaction, with a priest’s absolution as its form.", "breakaway_group": "Armenian Apostolic Church", "breakaway_answer": "No. Sacramental life follows the received Eastern rites and theology; that matter–form–intention schematization is not binding.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S8 para. 14", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s8-p15-en", "question": "Is extreme unction given with blessed olive oil when death is expected, anointing the senses, with a priest as minister?", "catholic_answer": "Yes. Extreme unction given with blessed olive oil when death is expected, anointing the senses, with a priest as minister.", "breakaway_group": "Armenian Apostolic Church", "breakaway_answer": "No. Sacramental life follows the received Eastern rites and theology; that matter–form–intention schematization is not binding.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S8 para. 15", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s8-p16-en", "question": "Is the sacrament of orders conferred by handing over the objects of each ministry, with a bishop as ordinary minister?", "catholic_answer": "Yes. The sacrament of orders is conferred by handing over the objects of each ministry, with a bishop as ordinary minister.", "breakaway_group": "Armenian Apostolic Church", "breakaway_answer": "No. Sacramental life follows the received Eastern rites and theology; that matter–form–intention schematization is not binding.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S8 para. 16", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s8-p17-en", "question": "Is matrimony a sign of Christ’s union with the Church, caused by present consent, indissoluble even if separation for fornication is allowed?", "catholic_answer": "Yes. Matrimony a sign of Christ’s union with the rite, caused by is present consent, indissoluble even if separation for fornication is allowed.", "breakaway_group": "Armenian Apostolic Church", "breakaway_answer": "No. Sacramental life follows the received Eastern rites and theology; that matter–form–intention schematization is not binding.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S8 para. 17", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s8-p27-en", "question": "Must the Constantinopolitan creed be sung with the Filioque, and must Chalcedon’s two natures and the sixth council’s two wills be accepted?", "catholic_answer": "Yes. The creed is to be received with ‘and the Son,’ and Chalcedon’s two natures in one person and the sixth council’s two wills are to be accepted.", "breakaway_group": "Armenian Apostolic Church", "breakaway_answer": "No. The Filioque addition is refused, and Christ is confessed in the miaphysite settlement rather than under those two-natures and two-wills union terms.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S8 para. 27", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s8-p28-en", "question": "Did Chalcedon and Pope Leo rightly define the truth about two natures in Christ?", "catholic_answer": "Yes. That synod and that pope rightly defined the truth about two natures in the one person of Christ.", "breakaway_group": "Armenian Apostolic Church", "breakaway_answer": "No. They did not rightly define that truth. After the union there is one united nature of the Word incarnate, not two natures as they taught.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S8 para. 28", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s8-p29-en", "question": "In the sacrifice of the altar, must a little water be mixed with the wine in the chalice?", "catholic_answer": "Yes. While the chalice is offered, a little water is to be mixed with the wine.", "breakaway_group": "Armenian Apostolic Church", "breakaway_answer": "No. The wine is offered unmixed; mixing water with the wine at the altar is not required.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S8 para. 29", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s8-p31-en", "question": "Does the Holy Spirit proceed from the Father and the Son, are the penitent cleansed after death by purifying pains, and does the Roman pontiff hold primacy over the whole Church?", "catholic_answer": "Yes. The Spirit proceeds from the Father and the Son; the penitent may be cleansed after death by purifying pains; and the Roman pontiff holds primacy over the whole Church.", "breakaway_group": "Armenian Apostolic Church", "breakaway_answer": "No. The Spirit proceeds from the Father; that purgatory formulation of purifying pains is not received; and Roman universal primacy is refused.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S8 para. 31", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s8-p5-en", "question": "Must the Constantinopolitan creed be received with the added phrase 'and the Son' (Filioque) and used in the Armenian churches as Florence decrees?", "catholic_answer": "Yes. The creed must be received with the added phrase ‘and the Son,’ as a licit clarification of the truth, and used in the liturgy as decreed.", "breakaway_group": "Armenian Apostolic Church", "breakaway_answer": "No. The creed must stand without that added phrase. Requiring ‘and the Son’ as a condition of communion is rejected; procession is confessed from the Father.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S8 para. 5", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s8-p6-en", "question": "Must the Armenians (and those entering Latin union) accept Chalcedon’s definition of two natures in the one person of Christ?", "catholic_answer": "Yes. Those entering union must accept the definition of two natures in the one person of Christ as the faith of the universal synods.", "breakaway_group": "Armenian Apostolic Church", "breakaway_answer": "No. That two-nature definition is not the price of communion. The faith is the miaphysite confession of one united nature of the Word incarnate.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S8 para. 6", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s8-p7-en", "question": "Must the Armenians accept Chalcedon and Pope Leo, contrary to the claim that both taught Nestorius’s heresy?", "catholic_answer": "Yes. They must accept that later synod and that pope. The claim that both taught the condemned dyophysite heresy is false; their definition is orthodox.", "breakaway_group": "Armenian Apostolic Church", "breakaway_answer": "No. They are not to be accepted on those terms. The charge that they teach heresy is not settled by submitting to them; the miaphysite confession stands without that acceptance.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S8 para. 7", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s8-p8-en", "question": "Are there seven sacraments of the new Law that contain and bestow grace, unlike the old Law’s sacraments which only prefigured grace?", "catholic_answer": "Yes. There seven sacraments of the new Law that contain and bestow grace, unlike the old Law’s sacraments which only prefigured grace.", "breakaway_group": "Armenian Apostolic Church", "breakaway_answer": "No. Sacramental life follows the received Eastern rites and theology; that matter–form–intention schematization is not binding.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S8 para. 8", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s8-p9-en", "question": "Do baptism, confirmation, Eucharist, penance, extreme unction, orders, and matrimony each perfect persons or govern and grow the Church as described?", "catholic_answer": "Yes. Do baptism, confirmation, Eucharist, penance, extreme unction, orders, and matrimony each perfect persons or govern and grow the rite as described.", "breakaway_group": "Armenian Apostolic Church", "breakaway_answer": "No. Ordination is received in the historic Eastern manner; that porrectio instrumentorum formula is not the required form.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S8 para. 9", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s11-p10-en", "question": "Was anyone conceived by man and woman liberated from the devil’s dominion except by faith in Christ, who alone unlocked heaven locked by Adam’s sin?", "catholic_answer": "Yes. Was anyone conceived by man and woman liberated from the devil’s dominion except by faith in Christ, who alone unlocked heaven locked by Adam’s sin.", "breakaway_group": "Coptic Orthodox Church", "breakaway_answer": "No. Sacramental life follows the received Eastern rites and theology; that matter–form–intention schematization is not binding.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S11 para. 10", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s11-p14-en", "question": "Can anyone outside the Catholic Church—pagans, Jews, heretics, or schismatics—share eternal life unless joined to that Church before death?", "catholic_answer": "No. Those outside the Church—pagans, Jews, heretics, or schismatics—cannot share eternal life unless joined to it before death. Only those who abide in that unity share the Church’s sacraments unto salvation.", "breakaway_group": "Coptic Orthodox Church", "breakaway_answer": "Yes, eternal life is not closed to everyone outside that Latin communion. Salvation is found in the older Eastern church of the fathers; joining that Roman-defined body is not the condition of eternal life.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S11 para. 14", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s11-p17-en", "question": "Should the second synod of Ephesus be condemned as impious for approving Eutychian error under Dioscorus?", "catholic_answer": "Yes. That second synod should be condemned as impious for approving Eutychian error under its Alexandrian president, who defended that heresy and persecuted the orthodox bishop of Constantinople.", "breakaway_group": "Coptic Orthodox Church", "breakaway_answer": "No. That synod and its president are not to be condemned as impious Eutychian partisans. The president is remembered as a defender of orthodoxy against a wrong settlement, not as a heresiarch’s champion.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S11 para. 17", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s11-p18-en", "question": "Must Christians embrace the Council of Chalcedon (630 fathers) as a universal council of the Church?", "catholic_answer": "Yes. Christians must embrace that council of the 630 fathers as a universal council of the Church, fourth among the ecumenical synods.", "breakaway_group": "Coptic Orthodox Church", "breakaway_answer": "No. It is not a universal council of the Church. The binding christological settlement is the earlier miaphysite confession, not that two-nature definition.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S11 para. 18", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s11-p19-en", "question": "Must Christians accept Constantinople II, which renewed Chalcedon’s definition of two natures in one person of Christ?", "catholic_answer": "Yes. Christians must accept that fifth synod, including its renewal of the two-nature definition in one person of Christ and its condemnation of Origenist errors.", "breakaway_group": "Coptic Orthodox Church", "breakaway_answer": "No. That synod is not accepted insofar as it renews the two-nature definition as binding. Orthodoxy is confessed in the miaphysite tradition without that renewal.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S11 para. 19", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s11-p20-en", "question": "Must Christians accept Constantinople III’s definition that in Christ there are two natures, two principles of action, and two wills in one person?", "catholic_answer": "Yes. In Christ there are two perfect natures, two principles of action, and two wills, in one and the same person.", "breakaway_group": "Coptic Orthodox Church", "breakaway_answer": "No. That dyothelete / two-natures package is not required for communion. Christ is confessed in the miaphysite tradition without accepting those dualities as the binding settlement.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S11 para. 20", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s11-p21-en", "question": "Are universal synods those legitimately confirmed by the authority of a Roman pontiff, including Florence’s unions with the Greeks and Armenians?", "catholic_answer": "Yes. Universal synods are those legitimately confirmed by the Roman pontiff’s authority, including the recent unions and their definitions.", "breakaway_group": "Coptic Orthodox Church", "breakaway_answer": "No. Universal synods are not defined by papal confirmation. Authority rests in the consensus of the ancient churches; those unions are not binding conditions of the faith.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S11 para. 21", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s11-p24-en", "question": "May fourth and further marriages be lawfully contracted when no canonical impediment exists?", "catholic_answer": "Yes. When no canonical impediment exists, not only second and third but also fourth and further marriages may lawfully be contracted.", "breakaway_group": "Coptic Orthodox Church", "breakaway_answer": "No. Repeated remarriage is restricted; fourth and further marriages are not treated as freely lawful in that way.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S11 para. 24", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s11-p5-en", "question": "Does the Holy Spirit proceed from the Father and the Son, as the holy Roman church professes in its teaching on the Trinity?", "catholic_answer": "Yes. The Holy Spirit proceeds from the Father and the Son: one God in three persons, the Spirit having his being from both.", "breakaway_group": "Coptic Orthodox Church", "breakaway_answer": "No. The Holy Spirit proceeds from the Father. Procession ‘from the Father and the Son’ as from one principle is not confessed.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S11 para. 5", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s11-p7-en", "question": "Does the Church accept as sacred Scripture the listed Old and New Testament books, including Tobit, Judith, Wisdom, Ecclesiasticus, and the Maccabees?", "catholic_answer": "Yes. It accepts as sacred Scripture the listed Old and New Testament books, including Tobit, Judith, Wisdom, Ecclesiasticus, and the Maccabees.", "breakaway_group": "Coptic Orthodox Church", "breakaway_answer": "No. Lasting communion does not require accepting that two-natures package; after the union he is confessed as one united nature of the Word incarnate.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) ent), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s13-p2-en", "question": "Has the Roman church’s profession of faith drawn Archbishop Abdala of Edessa, legate of the Syrian patriarch Ignatius, to petition for the rule of faith at this Lateran council?", "catholic_answer": "Yes. It has profession of faith drawn Archbishop Abdala of Edessa, legate of the Syrian patriarch Ignatius, to petition for the rule of faith at this Lateran council.", "breakaway_group": "Syriac Orthodox Church", "breakaway_answer": "No. Lasting communion does not require accepting that two-natures package; after the union he is confessed as one united nature of the Word incarnate.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S13 para. 2", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s13-p3-en", "question": "Was Abdala found orthodox except on the Spirit’s procession, Christ’s two natures, and his two wills and principles of action?", "catholic_answer": "Yes. Was Abdala found orthodox except on the Spirit’s procession, Christ’s two natures, and his two wills and principles of action.", "breakaway_group": "Syriac Orthodox Church", "breakaway_answer": "No. After the union he is confessed as one united nature of the Word incarnate, not ‘in two natures’ as that definition requires.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S13 para. 3", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s13-p4-en", "question": "Did Archbishop Abdala,
