’ as that definition requires.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S13 para. 8", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s13-p9-en", "question": "Are there in the one Lord Jesus Christ two natural principles of action and two natural wills, the human subject to the divine, without division, change, separation, or confusion?", "catholic_answer": "Yes. There in the one Lord Jesus Christ two natural principles of action and two natural wills, the human subject to the divine, without division, change, separation, or confusion.", "breakaway_group": "Syriac Orthodox Church", "breakaway_answer": "No. Lasting communion does not require accepting that two-natures package; after the union he is confessed as one united nature of the Word incarnate.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S13 para. 9", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s6-definition-of-the-holy-ecumenical-synod-of-florence-en", "question": "With Emperor John Palaeologus’s agreement, does this definition record the terms of union with the eastern church that follow?", "catholic_answer": "Yes. With Emperor John Palaeologus’s agreement, does this definition record the terms of union with the eastern church that follow.", "breakaway_group": "Eastern Orthodox churches", "breakaway_answer": "No. Reunion on those terms—Filioque, primacy, and related definitions—is refused; the received Byzantine confession stands.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S6 [Definition of the holy ecumenical synod of Florence]", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s6-p10-en", "question": "Is Christ’s body truly confected in both unleavened and leavened bread, and are souls who die penitent but without full satisfaction cleansed after death by cleansing pains, aided by the Church’s suffrages?", "catholic_answer": "Yes on both counts. Christ’s body is truly confected in either unleavened or leavened wheat bread according to each church’s rite; and penitent souls who die without full satisfaction are cleansed after death by cleansing pains, helped by the suffrages of the living.", "breakaway_group": "Eastern Orthodox churches", "breakaway_answer": "No on purgatorial cleansing pains and those Mass-centered suffrages as defined—the dead are prayed for, but not under that doctrine. Unleavened bread also remains contested; leavened bread is the proper use in the Eastern rite.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S6 para. 10", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s6-p11-en", "question": "Do souls free of sin (or cleansed of it) go straight to the beatific vision, while those dying in mortal or original sin alone go straight to hell?", "catholic_answer": "Yes. Purified souls go straight to the beatific vision, graded by merits; those dying in mortal sin or original sin alone go straight to hell, with unequal pains.", "breakaway_group": "Eastern Orthodox churches", "breakaway_answer": "Not under that immediate heaven-or-hell schema as defined. The destiny of souls after death is confessed with prayer for the dead, without accepting that Latin mapping of destinies.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S6 para. 11", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s6-p12-en", "question": "Does the Roman pontiff rank first among the patriarchs, with Constantinople second, then Alexandria, Antioch, and Jerusalem?", "catholic_answer": "Yes. The Roman pontiff ranks first among the patriarchs, then Constantinople, Alexandria, Antioch, and Jerusalem, without prejudice to their privileges.", "breakaway_group": "Eastern Orthodox churches", "breakaway_answer": "No as a claim of supreme jurisdiction. A primacy of honor among equals may be granted to Rome; first place with power over the whole Church is rejected.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S6 para. 12", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s6-p2-en", "question": "Was this definition issued with the deputies of the eastern patriarchs and other eastern representatives?", "catholic_answer": "Yes. Was this definition issued with the deputies of the eastern patriarchs and other eastern representatives.", "breakaway_group": "Eastern Orthodox churches", "breakaway_answer": "No. Reunion on those terms—Filioque, primacy, and related definitions—is refused; the received Byzantine confession stands.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S6 para. 2", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s6-p3-en", "question": "Has the wall dividing the western and eastern churches been removed, restoring peace and everlasting unity in Christ?", "catholic_answer": "Yes. It has the wall dividing the western and eastern churches been removed, restoring peace and everlasting unity in Christ.", "breakaway_group": "Eastern Orthodox churches", "breakaway_answer": "No. Reunion on those terms—Filioque, primacy, and related definitions—is refused; the received Byzantine confession stands.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S6 para. 3", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s6-p4-en", "question": "Have western and eastern fathers, after long discord, restored ancient love and achieved holy union in this council?", "catholic_answer": "Yes. It has western and eastern fathers, after long discord, restored ancient love and achieved holy union in this council.", "breakaway_group": "Eastern Orthodox churches", "breakaway_answer": "No. Reunion on those terms—Filioque, primacy, and related definitions—is refused; the received Byzantine confession stands.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S6 para. 4", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s6-p5-en", "question": "Are these works of reunion to be accepted as works of God, not mere human devices, and furthered with praise to Christ?", "catholic_answer": "Yes. These works of reunion to be accepted as works of God, not mere human devices, and furthered with praise to Christ.", "breakaway_group": "Eastern Orthodox churches", "breakaway_answer": "No. Reunion on those terms—Filioque, primacy, and related definitions—is refused; the received Byzantine confession stands.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S6 para. 5", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s6-p6-en", "question": "When Latins and Greeks discussed the Spirit’s procession, did they aim at the same meaning—from the Father and the Son, or from the Father through the Son?", "catholic_answer": "Yes. When Latins and discussed the Spirit’s procession, did they aim at the same meaning—from the Father and the Son, or from the Father through the Son.", "breakaway_group": "Eastern Orthodox churches", "breakaway_answer": "No. The Spirit proceeds from the Father; the Filioque as a required addition to the creed is refused.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S6 para. 6", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "flo-florence-s6-p7-en", "question": "Does the Holy Spirit proceed eternally from the Father and the Son as from one principle and a single spiration?", "catholic_answer": "Yes. The Holy Spirit proceeds eternally from the Father and the Son as from one principle and a single spiration, having his being from both.", "breakaway_group": "Eastern Orthodox churches", "breakaway_answer": "No. The Holy Spirit proceeds from the Father alone as cause. Eternal procession from Father and Son as from one principle is rejected.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S6 para. 7", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s6-p8-en", "question": "Because the Father gave the Son everything except being the Father, does the Son also have it from the Father that the Holy Spirit proceeds from the Son?", "catholic_answer": "Yes. Because the Father gave the Son everything except being the Father, the Son also eternally has it that the Spirit proceeds from the Son.", "breakaway_group": "Eastern Orthodox churches", "breakaway_answer": "No. That inference does not hold. What the Son receives in being begotten does not include causing the Spirit’s procession; the Spirit proceeds from the Father.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S6 para. 8", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "flo-florence-s6-p9-en", "question": "Was it licit to add the explanation 'and from the Son' (Filioque) to the Creed for the sake of declaring the truth?", "catholic_answer": "Yes. Adding ‘and from the Son’ to the Creed was licit and reasonable, under urgent necessity, to declare the truth of the Spirit’s procession.", "breakaway_group": "Eastern Orthodox churches", "breakaway_answer": "No. The Creed must not be altered by that insertion. The faith is confessed with the older wording; adding the phrase was not licit.", "council": "Council of Florence", "canonical_citation": "Florence (Florence) S6 para. 9", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "lyo2-profession-palaeologus-p2-en", "question": "Is the Son eternally born of the Father and temporally of Mary, true God and true man in two natures and one person, who suffered and rose in the flesh?", "catholic_answer": "Yes. The Son eternally born of the Father and temporally of Mary, is true God and true man in two natures and one person, who suffered and rose in the flesh.", "breakaway_group": "Eastern Orthodox churches", "breakaway_answer": "No. Reunion on those terms—Filioque, primacy, and related definitions—is refused; the received Byzantine confession stands.", "council": "Second Council of Lyons", "canonical_citation": "Lyons II, Profession of Faith of Michael Palaeologus (Denzinger 462)", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "lyo2-profession-palaeologus-p3-en", "question": "Is the Holy Spirit true God, proceeding from the Father and the Son?", "catholic_answer": "Yes. The Holy Spirit is true God, coequal and consubstantial with the Father and the Son, proceeding from the Father and the Son.", "breakaway_group": "Eastern Orthodox churches", "breakaway_answer": "The Holy Spirit is true God, coequal with the Father and the Son, but proceeds from the Father—not from the Father and the Son.", "council": "Second Council of Lyons", "canonical_citation": "Lyons II, Profession of Faith of Michael Palaeologus (Denzinger 463)", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "lyo2-profession-palaeologus-p4-en", "question": "If the baptized die truly repentant before making full satisfaction, are their souls cleansed after death by purifying punishments, helped by Masses, prayers, and alms?", "catholic_answer": "Yes. Such souls are cleansed after death by purifying punishments, and the offerings of the living—Masses, prayers, and alms—relieve those pains.", "breakaway_group": "Eastern Orthodox churches", "breakaway_answer": "No. There is no such state of purifying punishments after death relieved by Masses. The dead are commemorated and prayed for, but not under that purgatorial doctrine.", "council": "Second Council of Lyons", "canonical_citation": "Lyons II, Profession of Faith of Michael Palaeologus (Denzinger 464)", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "lyo2-profession-palaeologus-p5-en", "question": "Does the Roman Church rightly teach seven sacraments and prepare the Eucharist from unleavened bread, with the bread changed into Christ’s body and the wine into his blood?", "catholic_answer": "Yes. There are seven sacraments, and the Eucharist is prepared from unleavened bread, the bread changed into Christ’s body and the wine into his blood.", "breakaway_group": "Eastern Orthodox churches", "breakaway_answer": "Seven mysteries may be honored in another sense, but unleavened bread is not the norm—leavened bread is used. That Latin sacramental package is not binding as a condition of faith.", "council": "Second Council of Lyons", "canonical_citation": "Lyons II, Profession of Faith of Michael Palaeologus (Denzinger 465)", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "lyo2-profession-palaeologus-p6-en", "question": "Does the Roman Church hold the highest and complete primacy and spiritual power over the universal Catholic Church, received in Peter by the Roman pontiff?", "catholic_answer": "Yes. The highest and complete primacy and spiritual power over the universal Church belongs to that see in Peter’s successor, received from the Lord with fullness of power.", "breakaway_group": "Eastern Orthodox churches", "breakaway_answer": "No. That see does not hold universal supremacy. Primacy, if any, is honor among sister churches, not complete spiritual power over the whole Church.", "council": "Second Council of Lyons", "canonical_citation": "Lyons II, Profession of Faith of Michael Palaeologus (Denzinger 466)", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "lat4-constitution3-en", "question": "Must everyone who raises a heresy against the Catholic faith as there explained be excommunicated and anathematized as a heretic under that regime?", "catholic_answer": "Yes. Every heresy raised against that faith is excommunicated and anathematized; those condemned are handed over for due punishment, clerics being first degraded from their orders.", "breakaway_group": "Waldensians", "breakaway_answer": "No. Lay preaching and apostolic poverty outside that episcopal license are not condemned heresy under that regime; the anathematizing of such dissenters is refused.", "council": "Fourth Lateran Council", "canonical_citation": "Fourth Lateran Council, constitution 3", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "con-s15-articles-of-john-wyclif-selected-from-the-260-en", "question": "After consecration, does the host remain true bread in nature while being Christ’s body only figuratively (remanence)?", "catholic_answer": "No. After consecration the host does not remain true bread in substance. The whole substance is converted; Christ’s body is truly present, not only figuratively.", "breakaway_group": "Wycliffites / Lollards", "breakaway_answer": "Yes. After consecration the host remains true bread in nature while being Christ’s body figuratively—or in figure—so remanence is affirmed.", "council": "Council of Constance", "canonical_citation": "Constance S15 [Articles of John Wyclif selected from the 260]", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "con-s8-the-council-pronounces-john-wyclif-a-heretic-condemns-his-memory-and-orde", "question": "Was John Wyclif rightly judged a heretic whose memory and teaching are to be condemned?", "catholic_answer": "Yes. He was rightly judged a heretic whose memory and teaching are to be condemned; the process found no lawful defender.", "breakaway_group": "Wycliffites / Lollards", "breakaway_answer": "No. He was not a heretic. His memory and teaching should be honored as gospel reform, not condemned.", "council": "Council of Constance", "canonical_citation": "Constance S8 [The council pronounces John Wyclif a heretic, condemns his memory and orders his bones to be exhumed]", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "con-s13-condemnation-of-communion-under-both-kinds-recently-revived-among-the-bo", "question": "Must the Christian people receive the Eucharist under both bread and wine, so that the laity communicate under the wine as well?", "catholic_answer": "No. The approved custom of communion under one kind for the laity stands; the people are not bound to receive under both kinds.", "breakaway_group": "Hussites", "breakaway_answer": "Yes. The sacrament should be given to the people under both kinds; withholding the cup from the laity is refused.", "council": "Council of Constance", "canonical_citation": "Constance S13 [Condemnation of communion under both kinds, recently revived among the Bohemians by Jakoubek of Stribro]", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "con-s15-condemned-articles-of-j-hus-en", "question": "Is the one holy universal church identical with the total number of those predestined to salvation?", "catholic_answer": "No. The one holy universal church is not simply identical with the set of the predestined. The visible Church is the communion of the baptized under rightful pastors, not that number alone.", "breakaway_group": "Hussites", "breakaway_answer": "Yes. The one holy universal church is precisely the total number of those predestined to salvation—that is what ‘church’ means.", "council": "Council of Constance", "canonical_citation": "Constance S15 [Condemned articles of J. Hus]", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "con-s15-sentence-against-john-hus-en", "question": "Was John Hus rightly condemned by Constance as a heretic for obstinately holding Wycliffite and related errors?", "catholic_answer": "Yes. He was rightly condemned as a heretic for obstinately holding those errors against the faith.", "breakaway_group": "Hussites", "breakaway_answer": "No. He was not rightly condemned. The sentence was unjust; he is to be honored as a faithful witness, not a heretic.", "council": "Council of Constance", "canonical_citation": "Constance S15 [Sentence against John Hus]", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "con-s21-sentence-condemning-jerome-of-prague-en", "question": "Was Jerome of Prague rightly condemned by Constance as a heretic?", "catholic_answer": "Yes. He was rightly condemned as a heretic for not abiding in the faith as judged in that inquiry.", "breakaway_group": "Hussites", "breakaway_answer": "No. He was not rightly condemned. He is to be honored among the faithful reformers and martyrs, not as a heretic.", "council": "Council of Constance", "canonical_citation": "Constance S21 [Sentence condemning Jerome of Prague]", "notes": "", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s13-eucharist-canon2-en", "question": "In the Eucharist, is the whole substance of bread and wine converted into Christ’s body and blood, with only the appearances remaining (transubstantiation)?", "catholic_answer": "Yes. The whole substance of bread and wine is converted into Christ’s body and blood; only the appearances remain—that conversion is rightly called transubstantiation.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. There is no such conversion of the whole substance. Christ is present spiritually or sacramentally, or the elements remain bread and wine while signifying or conveying his body and blood.", "council": "Council of Trent", "canonical_citation": "Trent S13 Eucharist canon 2", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s14-penance-canon4-en", "question": "For the entire remission of sins in the sacrament of Penance, are contrition, confession, and satisfaction required as its three parts?", "catholic_answer": "Yes. Contrition, confession, and satisfaction are required as the three parts—as it were the matter—of that sacrament for the entire remission of sins.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. Remission is not tied to those three acts as mandatory matter. Forgiveness comes by repentance and faith, without requiring auricular confession and satisfaction in that juridical form.", "council": "Council of Trent", "canonical_citation": "Trent S14 Penance canon 4", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s22-mass-ch1-en", "question": "Did Christ institute the Sacrifice of the Mass as a true sacrifice of his body and blood?", "catholic_answer": "Yes. Christ instituted the Sacrifice of the Mass as a true sacrifice of his body and blood, a visible sacrifice representing and continuing the sacrifice of the cross.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. Christ did not institute a propitiatory Mass-sacrifice. He instituted the Lord’s Supper as communion and remembrance of his once-for-all death, not a repeated sacrificial offering.", "council": "Council of Trent", "canonical_citation": "Trent S22 Doctrine on the Sacrifice of the Mass ch. 1", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s22-mass-ch2-en", "question": "Is the Sacrifice of the Mass truly propitiatory for both the living and the dead?", "catholic_answer": "Yes. In the Mass the same Christ is contained and immolated in an unbloody manner; the sacrifice is truly propitiatory for the living and the dead.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. The Mass is not a propitiatory sacrifice for the living and the dead. Christ’s sacrifice on the cross was once for all; the Supper does not re-offer him for sin.", "council": "Council of Trent", "canonical_citation": "Trent S22 Doctrine on the Sacrifice of the Mass ch. 2", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s22-mass-ch3-en", "question": "May Masses be offered in honor of the saints?", "catholic_answer": "Yes. Masses may be offered in honor of the saints to obtain their intercession, while the sacrifice itself is offered to God alone.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. Masses should not be offered in honor of the saints. Worship and sacrificial offering belong to God alone; the saints are not to be honored that way in the Supper.", "council": "Council of Trent", "canonical_citation": "Trent S22 Doctrine on the Sacrifice of the Mass ch. 3", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s22-mass-ch4-en", "question": "Is the Canon of the Mass free from error and rightly retained as the Church’s holy prayer for offering the sacrifice?", "catholic_answer": "Yes. The Canon of the Mass is free from error—drawn from the Lord’s words and apostolic piety—and is rightly retained for offering the sacrifice.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. That Canon is not free from error as a sacrificial prayer and should not be retained. The Supper should use a rite without that propitiatory canon.", "council": "Council of Trent", "canonical_citation": "Trent S22 Doctrine on the Sacrifice of the Mass ch. 4", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s22-mass-ch5-en", "question": "Has the Church rightly instituted solemn Mass ceremonies—lights, incense, vestments, and varied tones of voice—as helps to divine worship?", "catholic_answer": "Yes. Lights, incense, vestments, and varied tones of voice are rightly instituted so that human minds may be raised to divine things.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. Those ceremonies are not apostolic necessities. Ritual may be simplified or stripped; such externals are human tradition, not required helps to true worship.", "council": "Council of Trent", "canonical_citation": "Trent S22 Doctrine on the Sacrifice of the Mass ch. 5", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s22-mass-ch6-en", "question": "Are Masses in which the priest alone communicates sacramentally lawful and to be approved?", "catholic_answer": "Yes. Masses in which the priest alone communicates are lawful and approved; they remain true sacrifices even when the faithful do not communicate sacramentally.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. Private Masses of that kind are not lawful. The Lord’s Supper is a communion of the faithful; a priest communicating alone is not the Supper Christ instituted.", "council": "Council of Trent", "canonical_citation": "Trent S22 Doctrine on the Sacrifice of the Mass ch. 6", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s22-mass-ch7-en", "question": "Must water be mixed with the wine in the chalice at Mass?", "catholic_answer": "Yes. Water must be mixed with the wine in the chalice, recalling Christ’s practice and the blood and water from his side, and the union of the people with him.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. Mixing water with the wine is not required by Christ or necessary to the sacrament. Wine alone suffices; that mixture is a human ceremony.", "council": "Council of Trent", "canonical_citation": "Trent S22 Doctrine on the Sacrifice of the Mass ch. 7", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s22-mass-ch8-en", "question": "Does the Church forbid celebrating the Mass everywhere in the vernacular, while requiring that its mysteries be explained to the people?", "catholic_answer": "Yes. It is not expedient that the Mass be celebrated everywhere in the vernacular, yet pastors must frequently explain its mysteries to the people.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. The vernacular should not be restricted that way. The Lord’s Supper ought to be in a language the people understand, so they can hear and take part.", "council": "Council of Trent", "canonical_citation": "Trent S22 Doctrine on the Sacrifice of the Mass ch. 8", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s22-mass-ch9-en", "question": "Did Trent resolve to condemn by the following canons whatever opposes the ancient faith on the Mass?", "catholic_answer": "Yes. resolve to condemn by the following canons whatever opposes the ancient faith on the Mass.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. The Mass is not a propitiatory sacrifice offered for the living and the dead in that sense; Calvary’s sacrifice is once for all.", "council": "Council of Trent", "canonical_citation": "Trent S22 Doctrine on the Sacrifice of the Mass ch. 9", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "trent-s22-mass-preamble-en", "question": "Does Trent teach that the Eucharist is to be preached as a true and singular sacrifice, preserving the ancient faith from error?", "catholic_answer": "Yes. It is taught that the Eucharist is to be preached as a true and singular sacrifice, preserving the ancient faith from error.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. The Mass is not a propitiatory sacrifice offered for the living and the dead in that sense; Calvary’s sacrifice is once for all.", "council": "Council of Trent", "canonical_citation": "Trent S22 Doctrine on the Sacrifice of the Mass, Preamble", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "trent-s23-orders-canon1-en", "question": "Is there in the New Testament a visible priesthood with power to consecrate and offer Christ’s body and blood and to forgive and retain sins?", "catholic_answer": "Yes. There is a visible New Testament priesthood with power to consecrate and offer Christ’s body and blood and to forgive and retain sins—not a mere office of preaching.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. There is no sacrificing ministerial priesthood of that kind. Ministry is chiefly preaching the gospel, and all believers share a priesthood; consecrating sacrifice is rejected.", "council": "Council of Trent", "canonical_citation": "Trent S23 Order canon 1", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s24-matrimony-canon1-en", "question": "Is matrimony truly and properly one of the seven sacraments of the New Law, instituted by Christ and conferring grace?", "catholic_answer": "Yes. Matrimony is truly and properly one of the seven sacraments of the evangelic law, instituted by Christ and conferring grace.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. Matrimony is an honorable estate, but it is not a sacrament of the New Law conferring grace in that sevenfold list.", "council": "Council of Trent", "canonical_citation": "Trent S24 Matrimony canon 1", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s24-matrimony-canon7-en", "question": "Has the Church erred in teaching that the marriage bond cannot be dissolved by adultery and that neither party may marry another during the other’s life?", "catholic_answer": "No. The Church has not erred. The marriage bond cannot be dissolved by adultery, and neither spouse may marry another during the other’s lifetime.", "breakaway_group": "Lutheran churches", "breakaway_answer": "Yes. The Church has erred on that point. For adultery or similar cause the bond may be treated as ended, and remarriage may be allowed while the other party still lives.", "council": "Council of Trent", "canonical_citation": "Trent S24 Matrimony canon 7", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s25-indulgences-decree-en", "question": "Did Christ grant the Church power to confer indulgences, and should that power be used?", "catholic_answer": "Yes. Christ granted the Church power to confer indulgences, she has used it from ancient times, and that power should continue to be used.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. Christ did not grant a power to confer indulgences, and they should not be used. Remission of temporal penalty by that system has no place in the gospel.", "council": "Council of Trent", "canonical_citation": "Trent S25 Decree concerning Indulgences", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s25-purgatory-decree-en", "question": "Is there a purgatory, and can the souls detained there be helped by the suffrages of the faithful?", "catholic_answer": "Yes. There is a purgatory, and souls detained there are helped by the suffrages of the faithful, especially the sacrifice of the altar.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. There is no purgatory as a post-mortem purifying state. The faithful departed are with Christ or await judgment without that intermediate purifying detention helped by Masses.", "council": "Council of Trent", "canonical_citation": "Trent S25 Decree concerning Purgatory", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s25-saints-images-decree-en", "question": "Should the faithful invoke the saints, venerate their relics, and honor sacred images?", "catholic_answer": "Yes. The faithful should invoke the saints, venerate their relics, and honor sacred images as helps to devotion toward God.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. The faithful should not invoke the saints, venerate relics, or honor sacred images. Prayer is directed to God alone; such practices are rejected as unbiblical.", "council": "Council of Trent", "canonical_citation": "Trent S25 Decree on the Invocation, Veneration, and Relics of Saints, and on Sacred Images", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s4-scripture-decree-en", "question": "Has the Church authoritatively fixed the canon of Scripture, including the deuterocanonical books, and must sacred tradition be received with Scripture?", "catholic_answer": "Yes. The canon is authoritatively fixed, including the deuterocanonical books, and apostolic traditions concerning faith and morals are to be received with equal reverence alongside Scripture.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. Scripture alone is the final rule. That closed canon—especially the deuterocanonicals as equal Scripture—is not binding, and tradition does not stand with equal authority beside Scripture.", "council": "Council of Trent", "canonical_citation": "Trent S4 Decree concerning the Canonical Scriptures", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s5-original-sin-canon1-en", "question": "Did Adam, by transgressing God’s commandment, lose holiness and justice, incur death and the devil’s captivity, and harm the whole human race?", "catholic_answer": "Yes. Adam, by transgressing God’s commandment, lose holiness and justice, incur death and the devil’s captivity, and harm the whole human race.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. It is refused that adam, by transgressing God’s commandment, lose holiness and justice, incur death and the devil’s captivity, and harm the whole human race.", "council": "Council of Trent", "canonical_citation": "Trent S5 Original Sin canon 1", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "trent-s6-justification-canon30-en", "question": "After justification, can a debt of temporal punishment remain to be paid in this world or in Purgatory, even when guilt and eternal punishment are remitted?", "catholic_answer": "Yes. Guilt and eternal punishment may be remitted while a debt of temporal punishment still remains to be paid in this world or in Purgatory.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. When justification remits guilt, no such remaining temporal debt in Purgatory is taught; Christ’s satisfaction covers the sinner without that residual penalty scheme.", "council": "Council of Trent", "canonical_citation": "Trent S6 Justification canon 30", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s6-justification-canon4-en", "question": "In coming to justification, does the human free will cooperate by assenting to God’s call, rather than remaining wholly passive?", "catholic_answer": "Yes. When God moves and calls, free will can and does cooperate by assenting, and can refuse; it is not merely passive like an inanimate thing.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. In receiving justifying grace the will is passive, or does not synergistically cooperate. Justification is by grace through faith without that preparatory cooperation.", "council": "Council of Trent", "canonical_citation": "Trent S6 Justification canon 4", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s7-sacraments-canon1-en", "question": "Did Christ institute exactly seven sacraments—Baptism, Confirmation, Eucharist, Penance, Extreme Unction, Order, and Matrimony?", "catholic_answer": "Yes. Christ instituted exactly seven sacraments—Baptism, Confirmation, Eucharist, Penance, Extreme Unction, Order, and Matrimony—each truly and properly a sacrament.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. Christ did not institute exactly those seven. In the strict sense there are two—baptism and the Lord’s Supper—though other rites may be valued without being sacraments of that kind.", "council": "Council of Trent", "canonical_citation": "Trent S7 Sacraments in General canon 1", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s7-sacraments-canon10-en", "question": "Do all Christians have power to administer the word and all the sacraments?", "catholic_answer": "No. Not all Christians have power to administer the word and all the sacraments. That power belongs to those rightly ordained for the ministry.", "breakaway_group": "Lutheran churches", "breakaway_answer": "Yes. All Christians share a priesthood of believers with broad power to minister the word and sacraments; ministry is not reserved to a sacrificing hierarchy.", "council": "Council of Trent", "canonical_citation": "Trent S7 Sacraments in General canon 10", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s7-sacraments-canon11-en", "question": "When ministers confer the sacraments, must they intend at least to do what the Church does?", "catholic_answer": "Yes. When ministers confer the sacraments they must intend at least to do what the Church does; without that intention the sacrament is not effected.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. Validity is not bound to that intention rule. What makes the rite effective is not dependence on intending ‘what the Church does’ in that sense.", "council": "Council of Trent", "canonical_citation": "Trent S7 Sacraments in General canon 11", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting. Primary Trent interlocutor; Reformed/Anglican/Anabaptist often share the rejection.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s7-sacraments-canon12-en", "question": "Does a minister in mortal sin, observing the essentials, still truly effect or confer the sacrament?", "catholic_answer": "Yes. A minister in mortal sin, observing the essentials, still truly effect or confer the sacrament.", "breakaway_group": "Lutheran churches", "breakaway_answer": "No. It is refused that a minister in mortal sin, observing the essentials, still truly effect or confer the sacrament.", "council": "Council of Trent", "canonical_citation": "Trent S7 Sacraments in General canon 12", "notes": "EXTENDED: previously excluded under explicit-trace. Breakaway stance inferred from group-level historical stake (disagreement), not locus-proven.", "tier": "extended", "confidence": "low", "contrast_kind": "inferred_opposition"}, {"id": "trent-s6-justification-canon9-en", "question": "Is the impious justified by faith alone, such that nothing else is required to cooperate in obtaining the grace of justification, and no preparation of the will is necessary?", "catholic_answer": "No. Justification is not by faith alone in that sense; cooperation and a preparation and disposition of the will are required to obtain the grace of justification.", "breakaway_group": "Reformed / Calvinist churches", "breakaway_answer": "Yes. The impious is justified by faith alone; nothing else is required to cooperate in obtaining that grace, and the will’s preparatory works are not necessary in that sense.", "council": "Council of Trent", "canonical_citation": "Trent S6 Justification canon 9", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s7-baptism-canon13-en", "question": "After baptism, are little children to be reckoned among the faithful even without actual faith of their own, so that omitting their baptism—or rebaptizing them later—is forbidden?", "catholic_answer": "Yes. Little children after baptism are reckoned among the faithful; they are not to be rebaptized when they reach discretion, and it is not better to omit their baptism for lack of their own act of faith.", "breakaway_group": "Anabaptist / Radical Reformation churches", "breakaway_answer": "No. Without their own actual faith, infants are not reckoned among the faithful by that baptism; believers’ baptism at years of discretion is required, and infant baptism is refused or redone.", "council": "Council of Trent", "canonical_citation": "Trent S7 Baptism canon 13", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "trent-s13-eucharist-canon1-en", "question": "In the Eucharist, are the body and blood—together with the soul and divinity, and so the whole Christ—contained truly, really, and substantially, and not only as in a sign, figure, or virtue?", "catholic_answer": "Yes. The whole Christ is contained truly, really, and substantially in the sacrament—not only as in a sign, figure, or virtue.", "breakaway_group": "Anglican Communion / Church of England", "breakaway_answer": "No—not under that ‘truly, really, and substantially’ definition. Christ’s body is received in a heavenly and spiritual manner; the local substantial containment of that kind is refused.", "council": "Council of Trent", "canonical_citation": "Trent S13 Eucharist canon 1", "notes": "Umbrella label: concrete Protestant confessions vary; answer states the Reformational position Trent is targeting.", "tier": "strict", "confidence": "high", "contrast_kind": "explicit_trace"}, {"id": "pa-ch2-canon1-en", "questi     const elGroup = document.getElementById("filter-group");
    const elCouncil = document.getElementById("filter-council");
    const elSearch = document.getElementById("filter-q");
    const elTier = document.getElementById("filter-tier");
    const elKind = document.getElementById("filter-kind");
    const elToc = document.getElementById("toc");
    const elViewer = document.getElementById("viewer");

    DATA.groups.forEach((g) => {
      const o = document.createElement("option");
      o.value = g; o.textContent = g;
      elGroup.appendChild(o);
    });
    DATA.councils.forEach((c) => {
      const o = document.createElement("option");
      o.value = c; o.textContent = c;
      elCouncil.appendChild(o);
    });

    document.getElementById("stat-n").textContent = String(DATA.n);
    document.getElementById("stat-groups").textContent = String(DATA.groups.length);
    if (DATA.has_tier) {
      const s = document.getElementById("stat-strict");
      const e = document.getElementById("stat-ext");
      if (s) s.textContent = String(DATA.n_strict);
      if (e) e.textContent = String(DATA.n_extended);
    }

    let filtered = DATA.rows.slice();
    let index = 0;

    function applyFilter() {
      const g = elGroup.value;
      const c = elCouncil.value;
      const q = (elSearch.value || "").trim().toLowerCase();
      const tier = elTier ? elTier.value : "";
      const kind = elKind ? elKind.value : "";
      filtered = DATA.rows.filter((r) => {
        if (g && r.breakaway_group !== g) return false;
        if (c && r.council !== c) return false;
        if (tier && r.tier !== tier) return false;
        if (kind && r.contrast_kind !== kind) return false;
        if (q) {
          const hay = (r.question + " " + r.canonical_citation + " " + r.breakaway_group + " " + r.council + " " + (r.contrast_kind || "")).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      document.getElementById("stat-shown").textContent = String(filtered.length);
      index = 0;
      renderToc();
      render();
    }

    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function shortQ(s) {
      s = String(s || "");
      return s.length > 72 ? s.slice(0, 69) + "…" : s;
    }

    function renderToc() {
      elToc.innerHTML = "";
      filtered.forEach((r, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = i === index ? "active" : "";
        const tag = r.tier ? ' · ' + r.tier : "";
        b.innerHTML = esc(shortQ(r.question)) + '<span class="g">' + esc(r.breakaway_group) + esc(tag) + "</span>";
        b.addEventListener("click", () => { index = i; render(); });
        elToc.appendChild(b);
      });
    }

    function render() {
      if (!filtered.length) {
        elViewer.innerHTML = '<p class="empty">No questions match this filter.</p>';
        return;
      }
      const r = filtered[index];
      const notes = r.notes
        ? '<p class="notes">' + esc(r.notes) + "</p>"
        : "";
      const badges = r.tier
        ? `<span class="badge ${esc(r.tier)}">${esc(r.tier)} · ${esc(r.confidence || "")}</span>
           <span class="badge">${esc(r.contrast_kind || "")}</span>`
        : "";
      elViewer.innerHTML = `
        <div class="nav">
          <button type="button" id="prev" ${index === 0 ? "disabled" : ""}>← Previous</button>
          <span class="pos">${index + 1} / ${filtered.length}</span>
          <button type="button" id="next" ${index >= filtered.length - 1 ? "disabled" : ""}>Next →</button>
        </div>
        <div class="meta-row">
          <span>${esc(r.council)}</span>
          <span class="pill">${esc(r.breakaway_group)}</span>
          ${badges}
        </div>
        <p class="question">${esc(r.question)}</p>
        <div class="answers">
          <article class="answer catholic">
            <h2>Catholic answer</h2>
            <p>${esc(r.catholic_answer)}</p>
          </article>
          <article class="answer breakaway">
            <h2>${esc(r.breakaway_group)}</h2>
            <p>${esc(r.breakaway_answer)}</p>
          </article>
        </div>
        <div class="cite">
          <strong>Citation</strong>
          ${esc(r.canonical_citation)}
        </div>
        ${notes}
      `;
      document.getElementById("prev").addEventListener("click", () => {
        if (index > 0) { index -= 1; render(); }
      });
      document.getElementById("next").addEventListener("click", () => {
        if (index < filtered.length - 1) { index += 1; render(); }
      });
      [...elToc.querySelectorAll("button")].forEach((b, i) => {
        b.classList.toggle("active", i === index);
      });
      const active = elToc.querySelector("button.active");
      if (active) active.scrollIntoView({ block: "nearest" });
    }

    elGroup.addEventListener("change", applyFilter);
    elCouncil.addEventListener("change", applyFilter);
    elSearch.addEventListener("input", applyFilter);
    if (elTier) elTier.addEventListener("change", applyFilter);
    if (elKind) elKind.addEventListener("change", applyFilter);

    document.addEventListener("keydown", (e) => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) return;
      if (e.key === "ArrowLeft" && index > 0) { index -= 1; render(); }
      if (e.key === "ArrowRight" && index < filtered.length - 1) { index += 1; render(); }
    });

    applyFilter();
  </script>
</body>
